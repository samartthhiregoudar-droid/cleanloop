# ---------- Video input ----------
camera:
  id: cam_1
  name: "Demo Camera"
  location: "Main Corridor"
  source: 0
  frame_width: 1280
  reconnect_seconds: 5

# ---------- Detection ----------
detection:
  model: yolo11s.pt                 # Upgraded to YOLO11 Small for higher detection accuracy
  min_person_conf: 0.55             # Tighter confidence filter for person detection
  device: auto

# ---------- Static object detection (MOG2) ----------
static_objects:
  min_blob_area_px: 500             # Raised from 300 to filter out noise & small shadows
  max_blob_area_px: 20000
  learning_rate: 0.001
  stable_frames: 20                 # Requires object to stay still slightly longer (~0.7s)
  warmup_seconds: 3
  match_distance_px: 25
  missing_seconds: 1.5
  max_foreground_ratio: 0.3
  person_padding: 0.2               # 20% padding around people to ignore feet/shadow artifacts
  require_person_origin: true       # Ignore random background noise; ONLY track items dropped by people
  target_zone_roi: [0.2, 0.0, 1.0, 1.0] # [ymin, xmin, ymax, xmax] fraction of frame for set ground area

# ---------- Littering event engine ----------
event_engine:
  link_distance_px: 80           # object must appear this close to a person's path
  leave_distance_px: 150         # person must move this far away
  static_seconds: 5              # object must stay this long after person leaves
  redeem_seconds: 30             # window for the person to come back and pick it up
  cooldown_seconds: 60           # no repeat alerts at the same spot for this long
  cooldown_radius_px: 50
  redeem_proximity_seconds: 5    # someone must have been near when the object vanished
  require_person: true           # set false only for quick desk tests without a person
  track_history_seconds: 5

# ---------- Evidence ----------
evidence:
  clip_seconds_before: 5
  clip_seconds_after: 5
  retention_days: 7

# ---------- BMRCL Garbage Pile Escalation ----------
bmrcl_escalation:
  enabled: true
  pile_area_threshold_px: 12000      # Total blob area in pixels that triggers BMRCL dispatch
  cooldown_seconds: 300              # Minimum time between calls/alerts (5 mins)
  phone_number: "+91-80-22969200"    # BMRCL Metro Operations & Maintenance Hotline
  department_name: "BMRCL Maintenance & Sanitation Ops"
  alert_message: "Urgently required: Large garbage accumulation detected at BMRCL station camera zone."
  twilio:
    account_sid: ""                  # Set via environment variable TWILIO_ACCOUNT_SID or here
    auth_token: ""                   # Set via environment variable TWILIO_AUTH_TOKEN or here
    from_number: ""                  # Registered Twilio phone number
